name: Test Starter Kit Integration

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  test-starter-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clone starter-kit
        run: git clone https://github.com/proto-kit/starter-kit.git starter-kit

      - name: Checkout framework
        uses: actions/checkout@v4
        with:
          path: starter-kit/framework

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.9.0

      - name: Install pnpm
        run: npm install -g pnpm@9.8.0

      - name: Add framework packages to pnpm workspace
        working-directory: starter-kit
        run: |
          echo "" >> pnpm-workspace.yaml
          echo "  - framework/packages/*" >> pnpm-workspace.yaml
          cat pnpm-workspace.yaml

      - name: Rewrite @proto-kit/* paths to workspace protocol
        working-directory: starter-kit
        run: |
          find . -name 'package.json' -not -path '*/node_modules/*' -not -path '*/framework/*' | while read pkg; do
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('$pkg', 'utf8'));
              let changed = false;
              for (const depType of ['dependencies', 'devDependencies', 'peerDependencies']) {
                if (!p[depType]) continue;
                for (const [name, version] of Object.entries(p[depType])) {
                  if (name.startsWith('@proto-kit/') && (version.includes('framework/') || version.startsWith('file:') || version.startsWith('../'))) {
                    p[depType][name] = 'workspace:*';
                    changed = true;
                  }
                }
              }
              if (changed) {
                fs.writeFileSync('$pkg', JSON.stringify(p, null, 2) + '\n');
                console.log('Rewrote: $pkg');
              }
            "
          done

      - name: Install dependencies
        working-directory: starter-kit
        run: pnpm install --no-frozen-lockfile

      - name: Build starter-kit
        working-directory: starter-kit
        run: pnpm run build