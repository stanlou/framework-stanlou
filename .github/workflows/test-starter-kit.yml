name: Test Starter Kit Integration

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  test-starter-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout & build the framework ──────────────────────
      - name: Checkout framework
        uses: actions/checkout@v4
        with:
          path: framework

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.9.0

      - name: Install pnpm
        run: npm install -g pnpm@9.8.0

      - name: Install & build framework
        working-directory: framework
        run: |
          npm ci --workspaces --include-workspace-root
          npm run build

      # ── 2. Pack all @proto-kit/* packages into tarballs ────────
      - name: Pack framework packages
        working-directory: framework
        run: |
          mkdir -p /tmp/tarballs
          for dir in packages/*/; do
            (cd "$dir" && npm pack --pack-destination /tmp/tarballs)
          done
          ls /tmp/tarballs/

      # ── 3. Clone starter-kit & override all @proto-kit/* deps ──
      #    pnpm.overrides applies globally to every package.json
      #    in the workspace (root, packages/chain, apps/web, etc.)
      - name: Clone starter-kit
        run: git clone https://github.com/proto-kit/starter-kit.git starter-kit

      - name: Override @proto-kit/* with local builds
        working-directory: starter-kit
        run: |
          node -e "
            const fs = require('fs'), cp = require('child_process');

            // Override all @proto-kit/* packages with local tarballs
            const overrides = Object.fromEntries(
              fs.readdirSync('/tmp/tarballs').filter(f => f.endsWith('.tgz')).map(f => {
                const name = JSON.parse(cp.execSync('tar xzf /tmp/tarballs/' + f + ' --to-stdout package/package.json')).name;
                return [name, 'file:/tmp/tarballs/' + f];
              })
            );

            // Also override o1js and tsyringe which the starter-kit
            // references via hardcoded paths to framework/node_modules/
            overrides['o1js'] = '^2.10.0';
            overrides['tsyringe'] = '^4.10.0';

            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.pnpm = { ...pkg.pnpm, overrides: { ...pkg.pnpm?.overrides, ...overrides } };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('Overrides applied:', JSON.stringify(overrides, null, 2));
          "

      # ── 4. Install, build & test ──────────────────────────────
      - name: Install starter-kit dependencies
        working-directory: starter-kit
        run: pnpm install --no-frozen-lockfile

      - name: Build starter-kit
        working-directory: starter-kit
        run: pnpm run build